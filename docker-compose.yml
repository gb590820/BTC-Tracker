services:
  # Optional: a self-hosted blockchain backend for on-chain address watching.
  #
  # Off by default because it needs ~600 GB of disk for an archival-ish node and
  # hours of initial indexing. Without it, point the On-chain settings at
  # https://mempool.space/api, which sends your watched addresses to that third
  # party — fine for a test, worth avoiding for a wallet you care about.
  #
  # To use it: uncomment this service, then set the endpoint in
  # Settings → On-chain to http://electrs:3000/api
  #
  # electrs needs bitcoind with two indexes enabled, and a cookie file it can read:
  #   bitcoind -txindex=1 -blockfilterindex=1 -cookie=/home/bitcoin/.bitcoin/cookie
  #
  # bitcoind:
  #   image: bitcoin/bitcoin:27
  #   container_name: btc-bitcoind
  #   volumes:
  #     - btc_chain:/bitcoin
  #   ports:
  #     - "8332:8332"
  #     - "8333:8333"
  #   restart: unless-stopped
  #   networks:
  #     - btc-tracker-network
  #
  # electrs:
  #   image: blockstream/electrs:latest
  #   container_name: btc-electrs
  #   environment:
  #     - ELECTRS_HOST=0.0.0.0
  #     - ELECTRS_PORT=3000
  #     - ELECTRS_COOKIE_FILE=/bitcoin/.bitcoin/cookie
  #     - ELECTRS_BACKEND=bitcoind
  #     - ELECTRS_TX_GRAPH_CACHE_SIZE=64
  #   volumes:
  #     - electrs_db:/db
  #     - btc_chain:/bitcoin:ro
  #   ports:
  #     - "3001:3000"
  #   depends_on:
  #     - bitcoind
  #   restart: unless-stopped
  #   networks:
  #     - btc-tracker-network

  btc-tracker:
    image: thewilqq/btc-tracker:latest  # Use :latest, :stable, or specific version like :v0.6.0
    container_name: btc-tracker-app
    ports:
      - "3000:3000"
    # Uncomment and set to your user ID
    # user: "568:568"  # Replace with your actual user:group ID
    environment:
      - NODE_ENV=production
      # PUID/PGID for permission management (TrueNAS, homelab compatibility)
      - PUID=${PUID:-1000}  # Set to your user ID: `id -u`
      - PGID=${PGID:-1000}  # Set to your group ID: `id -g`
      # Flexible database paths - choose one approach:
      - DATABASE_URL=file:/app/data/bitcoin-tracker.db     # Recommended: mounted volume
      # - DATABASE_URL=file:/data/bitcoin-tracker.db       # Host directory mount
      # - DATABASE_URL=postgresql://user:pass@postgres:5432/btctracker  # PostgreSQL
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET:-your-super-secure-secret-key-here-change-this}
      - NEXTAUTH_URL=http://localhost:3000
    volumes:
      # Mount data directory for flexible database storage
      - btc_data:/app/data
      # Optional: mount host directory for database
      # - /host/path/to/data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - btc-tracker-network

volumes:
  btc_data:
    driver: local
  # btc_chain:
  #   driver: local
  # electrs_db:
  #   driver: local

networks:
  btc-tracker-network:
    driver: bridge 

# User id approach differs based on the system and how we are mounting the volume